<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technician Login - Peekaboo Shades</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      background: linear-gradient(135deg, #f5f0ec 0%, #e8e0da 100%);
    }

    .login-container {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    .login-brand {
      flex: 1;
      background: linear-gradient(135deg, #8E6545 0%, #A67C5B 50%, #6B4C35 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .login-brand::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 50%);
      animation: pulse 15s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .brand-content {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .brand-logo {
      width: 100px;
      height: 100px;
      background: white;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .brand-logo img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .brand-content h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .brand-content p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 2rem;
    }

    .brand-features {
      text-align: left;
      max-width: 280px;
    }

    .brand-feature {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      padding: 0.75rem;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .brand-feature svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .brand-feature span {
      font-size: 0.9rem;
    }

    .login-form-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem;
    }

    .login-form {
      width: 100%;
      max-width: 400px;
    }

    .login-form h2 {
      font-size: 1.75rem;
      color: #1f2937;
      margin-bottom: 0.5rem;
    }

    .login-form p {
      color: #6b7280;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-weight: 500;
      color: #374151;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 1rem 1.25rem;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s;
      background: white;
    }

    .form-group input:focus {
      outline: none;
      border-color: #8E6545;
      box-shadow: 0 0 0 3px rgba(142, 101, 69, 0.1);
    }

    .form-group input::placeholder {
      color: #9ca3af;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .remember-me input {
      width: 18px;
      height: 18px;
      accent-color: #8E6545;
    }

    .remember-me span {
      font-size: 0.9rem;
      color: #4b5563;
    }

    .forgot-password {
      color: #8E6545;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #8E6545 0%, #A67C5B 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(142, 101, 69, 0.3);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(142, 101, 69, 0.4);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .signup-link {
      text-align: center;
      margin-top: 2rem;
      color: #6b7280;
      font-size: 0.95rem;
    }

    .signup-link a {
      color: #8E6545;
      font-weight: 600;
      text-decoration: none;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      background: #FEE2E2;
      border: 1px solid #FECACA;
      color: #991B1B;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .back-link {
      position: absolute;
      top: 2rem;
      left: 2rem;
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .back-link:hover {
      opacity: 1;
    }

    .back-link svg {
      width: 20px;
      height: 20px;
    }

    @media (max-width: 900px) {
      .login-container {
        flex-direction: column;
      }
      .login-brand {
        padding: 2rem;
        min-height: auto;
      }
      .brand-features {
        display: none;
      }
      .back-link {
        position: static;
        margin-bottom: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-brand">
      <a href="/" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Home
      </a>
      <div class="brand-content">
        <div class="brand-logo">
          <img src="/images/peekabooshades_logo.jpeg" alt="Peekaboo Shades">
        </div>
        <h1>Technician Portal</h1>
        <p>Peekaboo Shades Installation</p>
        <div class="brand-features">
          <div class="brand-feature">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span>View your schedule & appointments</span>
          </div>
          <div class="brand-feature">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <span>Get customer locations & details</span>
          </div>
          <div class="brand-feature">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
              <line x1="1" y1="10" x2="23" y2="10"/>
            </svg>
            <span>Record payments on-site</span>
          </div>
        </div>
      </div>
    </div>
    <div class="login-form-container">
      <form class="login-form" onsubmit="handleLogin(event)">
        <h2>Welcome Back</h2>
        <p>Sign in to access your technician dashboard</p>

        <div id="errorMessage" class="error-message"></div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">Sign In</button>

        <div class="signup-link">
          New technician? <a href="/technician/signup.html">Register here</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Check if already logged in
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('technician_token');
      if (token) {
        verifyToken(token);
      }
    });

    async function verifyToken(token) {
      try {
        const response = await fetch('/api/technician/verify', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await response.json();
        if (result.success) {
          window.location.href = '/technician/';
        }
      } catch (error) {
        localStorage.removeItem('technician_token');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const errorMessage = document.getElementById('errorMessage');

      errorMessage.classList.remove('show');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const response = await fetch('/api/technician/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (result.success) {
          localStorage.setItem('technician_token', result.token);
          localStorage.setItem('technician_data', JSON.stringify(result.technician));
          window.location.href = '/technician/';
        } else {
          errorMessage.textContent = result.error || 'Invalid email or password';
          errorMessage.classList.add('show');
        }
      } catch (error) {
        errorMessage.textContent = 'Connection error. Please try again.';
        errorMessage.classList.add('show');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
