<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interior Designers - Peekaboo Shades Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css?v=1737200003.0.28">
  <script src="/admin/js/adminNavConfig.js?v=1737200002"></script>
  <style>
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
    .stat-card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .stat-card h3 { font-size: 0.85rem; color: #666; margin-bottom: 0.5rem; }
    .stat-card .value { font-size: 2rem; font-weight: 700; color: #8E6545; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .search-box { padding: 0.75rem 1rem; border: 1px solid #ddd; border-radius: 8px; width: 300px; }
    .filter-select { padding: 0.75rem 1rem; border: 1px solid #ddd; border-radius: 8px; }
    .designers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
    .designer-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .designer-header { padding: 1.5rem; display: flex; gap: 1rem; align-items: start; }
    .designer-avatar { width: 60px; height: 60px; border-radius: 50%; background: #8E6545; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 600; }
    .designer-info { flex: 1; }
    .designer-name { font-size: 1.1rem; font-weight: 600; margin: 0; }
    .designer-company { color: #666; font-size: 0.9rem; margin: 0.25rem 0; }
    .designer-badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-active { background: #D1FAE5; color: #065F46; }
    .badge-pending { background: #FEF3C7; color: #92400E; }
    .badge-inactive { background: #FEE2E2; color: #991B1B; }
    .designer-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; padding: 1rem 1.5rem; background: #f9f9f9; }
    .designer-stat { text-align: center; }
    .designer-stat-value { font-size: 1.25rem; font-weight: 700; color: #8E6545; }
    .designer-stat-label { font-size: 0.75rem; color: #666; }
    .designer-contact { padding: 1rem 1.5rem; font-size: 0.9rem; color: #666; }
    .designer-contact div { margin-bottom: 0.25rem; }
    .designer-actions { display: flex; gap: 0.5rem; padding: 1rem 1.5rem; border-top: 1px solid #eee; }
    .btn-action { flex: 1; padding: 0.5rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-edit { background: #8E6545; color: white; }
    .btn-view { background: #E5E7EB; color: #374151; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: white; border-radius: 12px; padding: 2rem; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 1.5rem; }
    .modal-header h2 { margin: 0; }
    .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .btn-submit { width: 100%; padding: 0.875rem; background: #8E6545; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar"></aside>
    <main class="admin-main">
      <header class="admin-header">
        <h1>Interior Designers</h1>
        <div class="header-actions">
          <button class="btn-primary" onclick="openModal()">+ Add Designer</button>
        </div>
      </header>
      <div class="admin-content">
        <div class="stats">
          <div class="stat-card"><h3>Total Designers</h3><div class="value" id="stat-total">0</div></div>
          <div class="stat-card"><h3>Active</h3><div class="value" id="stat-active">0</div></div>
          <div class="stat-card"><h3>Pending Approval</h3><div class="value" id="stat-pending">0</div></div>
          <div class="stat-card"><h3>Total Revenue</h3><div class="value" id="stat-revenue">$0</div></div>
        </div>
        <div class="controls">
          <input type="text" class="search-box" id="searchInput" placeholder="Search designers..." oninput="filterDesigners()">
          <select class="filter-select" id="statusFilter" onchange="filterDesigners()">
            <option value="all">All Status</option>
            <option value="active">Active</option>
            <option value="pending">Pending</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
        <div class="designers-grid" id="designersGrid"></div>
      </div>
    </main>
  </div>
  <div class="modal" id="designerModal">
    <div class="modal-content">
      <div class="modal-header"><h2 id="modalTitle">Add Designer</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
      <form onsubmit="saveDesigner(event)">
        <input type="hidden" id="designerId">
        <div class="form-row">
          <div class="form-group"><label>First Name</label><input type="text" id="firstName" required></div>
          <div class="form-group"><label>Last Name</label><input type="text" id="lastName" required></div>
        </div>
        <div class="form-group"><label>Company Name</label><input type="text" id="company"></div>
        <div class="form-row">
          <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
          <div class="form-group"><label>Phone</label><input type="tel" id="phone"></div>
        </div>
        <div class="form-group"><label>Website</label><input type="url" id="website" placeholder="https://"></div>
        <div class="form-row">
          <div class="form-group">
            <label>Status</label>
            <select id="status">
              <option value="pending">Pending Approval</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
          <div class="form-group">
            <label>Discount Tier</label>
            <select id="tier">
              <option value="standard">Standard (15%)</option>
              <option value="preferred">Preferred (20%)</option>
              <option value="elite">Elite (25%)</option>
            </select>
          </div>
        </div>
        <div class="form-group"><label>Notes</label><textarea id="notes" rows="2"></textarea></div>
        <button type="submit" class="btn-submit">Save Designer</button>
      </form>
    </div>
  </div>
  <script>
    let designers = [
      { id: 'd-1', firstName: 'Sarah', lastName: 'Mitchell', company: 'Mitchell Design Studio', email: 'sarah@mitchelldesign.com', phone: '555-0201', website: 'https://mitchelldesign.com', status: 'active', tier: 'elite', orders: 42, revenue: 68500, commission: 2740, joinDate: '2023-06-15' },
      { id: 'd-2', firstName: 'James', lastName: 'Chen', company: 'Chen Interiors', email: 'james@cheninteriors.com', phone: '555-0202', website: 'https://cheninteriors.com', status: 'active', tier: 'preferred', orders: 28, revenue: 45200, commission: 1808, joinDate: '2023-09-20' },
      { id: 'd-3', firstName: 'Emily', lastName: 'Rodriguez', company: 'ER Design Co', email: 'emily@erdesign.co', phone: '555-0203', website: '', status: 'pending', tier: 'standard', orders: 0, revenue: 0, commission: 0, joinDate: '2024-01-18' },
      { id: 'd-4', firstName: 'Michael', lastName: 'Thompson', company: 'Thompson Home Design', email: 'michael@thompsonhome.com', phone: '555-0204', website: 'https://thompsonhome.com', status: 'active', tier: 'standard', orders: 15, revenue: 22800, commission: 912, joinDate: '2023-11-05' },
      { id: 'd-5', firstName: 'Lisa', lastName: 'Park', company: 'Park & Associates', email: 'lisa@parkassociates.com', phone: '555-0205', website: 'https://parkassociates.com', status: 'inactive', tier: 'preferred', orders: 8, revenue: 12400, commission: 496, joinDate: '2023-04-10' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('admin_token')) { window.location.href = '/admin/login.html'; return; }
      AdminNavConfig.initSidebar('designers');
      updateStats();
      renderDesigners();
    });

    function updateStats() {
      document.getElementById('stat-total').textContent = designers.length;
      document.getElementById('stat-active').textContent = designers.filter(d => d.status === 'active').length;
      document.getElementById('stat-pending').textContent = designers.filter(d => d.status === 'pending').length;
      document.getElementById('stat-revenue').textContent = '$' + (designers.reduce((s, d) => s + d.revenue, 0) / 1000).toFixed(0) + 'K';
    }

    function filterDesigners() {
      renderDesigners();
    }

    function renderDesigners() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      let filtered = designers.filter(d => {
        const matchSearch = d.firstName.toLowerCase().includes(search) || d.lastName.toLowerCase().includes(search) || d.company.toLowerCase().includes(search) || d.email.toLowerCase().includes(search);
        const matchStatus = status === 'all' || d.status === status;
        return matchSearch && matchStatus;
      });

      document.getElementById('designersGrid').innerHTML = filtered.map(d => `
        <div class="designer-card">
          <div class="designer-header">
            <div class="designer-avatar">${d.firstName[0]}${d.lastName[0]}</div>
            <div class="designer-info">
              <h3 class="designer-name">${d.firstName} ${d.lastName}</h3>
              <p class="designer-company">${d.company}</p>
              <span class="designer-badge badge-${d.status}">${d.status}</span>
            </div>
          </div>
          <div class="designer-stats">
            <div class="designer-stat">
              <div class="designer-stat-value">${d.orders}</div>
              <div class="designer-stat-label">Orders</div>
            </div>
            <div class="designer-stat">
              <div class="designer-stat-value">$${(d.revenue / 1000).toFixed(1)}K</div>
              <div class="designer-stat-label">Revenue</div>
            </div>
            <div class="designer-stat">
              <div class="designer-stat-value">$${d.commission}</div>
              <div class="designer-stat-label">Commission</div>
            </div>
          </div>
          <div class="designer-contact">
            <div>📧 ${d.email}</div>
            <div>📞 ${d.phone}</div>
            ${d.website ? `<div>🌐 ${d.website}</div>` : ''}
          </div>
          <div class="designer-actions">
            <button class="btn-action btn-edit" onclick="editDesigner('${d.id}')">Edit</button>
            <button class="btn-action btn-view" onclick="viewOrders('${d.id}')">View Orders</button>
          </div>
        </div>
      `).join('');
    }

    function openModal(designer = null) {
      document.getElementById('designerId').value = designer ? designer.id : '';
      document.getElementById('firstName').value = designer ? designer.firstName : '';
      document.getElementById('lastName').value = designer ? designer.lastName : '';
      document.getElementById('company').value = designer ? designer.company : '';
      document.getElementById('email').value = designer ? designer.email : '';
      document.getElementById('phone').value = designer ? designer.phone : '';
      document.getElementById('website').value = designer ? designer.website : '';
      document.getElementById('status').value = designer ? designer.status : 'pending';
      document.getElementById('tier').value = designer ? designer.tier : 'standard';
      document.getElementById('notes').value = designer ? designer.notes || '' : '';
      document.getElementById('modalTitle').textContent = designer ? 'Edit Designer' : 'Add Designer';
      document.getElementById('designerModal').classList.add('active');
    }

    function closeModal() { document.getElementById('designerModal').classList.remove('active'); }

    function editDesigner(id) {
      const designer = designers.find(d => d.id === id);
      if (designer) openModal(designer);
    }

    function viewOrders(id) {
      const designer = designers.find(d => d.id === id);
      if (designer) alert(`Viewing orders for ${designer.firstName} ${designer.lastName}\nTotal: ${designer.orders} orders`);
    }

    function saveDesigner(e) {
      e.preventDefault();
      const id = document.getElementById('designerId').value;
      const data = {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        company: document.getElementById('company').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        website: document.getElementById('website').value,
        status: document.getElementById('status').value,
        tier: document.getElementById('tier').value,
        notes: document.getElementById('notes').value
      };

      if (id) {
        const idx = designers.findIndex(d => d.id === id);
        if (idx >= 0) designers[idx] = { ...designers[idx], ...data };
      } else {
        data.id = 'd-' + Date.now();
        data.orders = 0;
        data.revenue = 0;
        data.commission = 0;
        data.joinDate = new Date().toISOString().split('T')[0];
        designers.push(data);
      }

      closeModal();
      updateStats();
      renderDesigners();
      alert(id ? 'Designer updated' : 'Designer added');
    }

    document.getElementById('designerModal').addEventListener('click', e => { if (e.target.id === 'designerModal') closeModal(); });
  </script>
</body>
</html>
