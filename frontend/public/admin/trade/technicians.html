<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technicians - Peekaboo Shades Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css?v=1737200003.0.28">
  <script src="/admin/js/adminNavConfig.js?v=1737200002"></script>
  <style>
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
    .stat-card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .stat-card h3 { font-size: 0.85rem; color: #666; margin-bottom: 0.5rem; text-transform: uppercase; }
    .stat-card .value { font-size: 2rem; font-weight: 700; color: #8E6545; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .search-box { padding: 0.75rem 1rem; border: 2px solid #e5e7eb; border-radius: 10px; width: 300px; font-size: 0.95rem; transition: border-color 0.2s; }
    .search-box:focus { outline: none; border-color: #8E6545; }
    .filter-select { padding: 0.75rem 1rem; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 0.95rem; background: white; cursor: pointer; }
    .technicians-table { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f9f9f9; padding: 1rem; text-align: left; font-weight: 600; font-size: 0.85rem; color: #666; text-transform: uppercase; }
    td { padding: 1rem; border-top: 1px solid #eee; }
    tr:hover { background: #faf8f6; }
    .tech-cell { display: flex; align-items: center; gap: 0.75rem; }
    .tech-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #8E6545 0%, #A67C5B 100%); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.95rem; }
    .tech-info { display: flex; flex-direction: column; }
    .tech-name { font-weight: 600; color: #1f2937; }
    .tech-email { font-size: 0.85rem; color: #666; }
    .badge { padding: 0.3rem 0.65rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .badge-active { background: #D1FAE5; color: #065F46; }
    .badge-pending { background: #FEF3C7; color: #92400E; }
    .badge-inactive { background: #FEE2E2; color: #991B1B; }
    .specialty-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .specialty-tag { padding: 0.25rem 0.5rem; background: #f5f0ec; color: #8E6545; border-radius: 6px; font-size: 0.75rem; font-weight: 500; }
    .rating-display { display: flex; align-items: center; gap: 0.35rem; }
    .rating-stars { color: #F59E0B; font-size: 0.9rem; }
    .rating-value { font-weight: 600; color: #374151; }
    .rating-count { font-size: 0.8rem; color: #6b7280; }
    .btn-action { padding: 0.4rem 0.75rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; margin-right: 0.25rem; font-weight: 500; transition: all 0.2s; }
    .btn-edit { background: #8E6545; color: white; }
    .btn-edit:hover { background: #7a563a; }
    .btn-view { background: #E5E7EB; color: #374151; }
    .btn-view:hover { background: #d1d5db; }
    .btn-delete { background: #FEE2E2; color: #991B1B; }
    .btn-delete:hover { background: #FECACA; }

    /* Modal Styles */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal.active { display: flex; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-content { background: white; border-radius: 16px; padding: 0; max-width: 640px; width: 90%; max-height: 90vh; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); animation: slideIn 0.3s ease; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2rem; background: linear-gradient(135deg, #8E6545 0%, #A67C5B 100%); color: white; }
    .modal-header h2 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .modal-close { background: rgba(255,255,255,0.2); border: none; font-size: 1.25rem; cursor: pointer; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .modal-close:hover { background: rgba(255,255,255,0.3); }
    .modal-body { padding: 2rem; max-height: calc(90vh - 80px); overflow-y: auto; }
    .form-section { margin-bottom: 1.75rem; }
    .form-section-title { font-size: 0.8rem; font-weight: 600; color: #8E6545; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #f0e6df; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #374151; font-size: 0.9rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.875rem 1rem; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 0.95rem; transition: border-color 0.2s, box-shadow 0.2s; background: #fafafa; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #8E6545; box-shadow: 0 0 0 3px rgba(142,101,69,0.1); background: white; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .specialty-checkbox-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    .specialty-checkbox { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; background: #faf8f6; border: 2px solid #e8e0da; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    .specialty-checkbox:hover { border-color: #8E6545; background: #f5f0ec; }
    .specialty-checkbox input { margin: 0; width: 18px; height: 18px; accent-color: #8E6545; cursor: pointer; }
    .specialty-checkbox span { font-size: 0.9rem; color: #374151; }
    .specialty-checkbox input:checked + span { color: #8E6545; font-weight: 500; }
    .specialty-checkbox:has(input:checked) { background: #f5f0ec; border-color: #8E6545; box-shadow: 0 0 0 2px rgba(142,101,69,0.1); }
    .btn-submit { width: 100%; padding: 1rem; background: linear-gradient(135deg, #8E6545 0%, #A67C5B 100%); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: transform 0.2s, box-shadow 0.2s; }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(142,101,69,0.3); }
    .input-hint { font-size: 0.8rem; color: #6b7280; margin-top: 0.35rem; }
    .temp-password-box { background: #FEF3C7; border: 2px solid #F59E0B; border-radius: 10px; padding: 1rem; margin-top: 1rem; }
    .temp-password-box h4 { color: #92400E; margin: 0 0 0.5rem 0; font-size: 0.9rem; }
    .temp-password-box code { background: white; padding: 0.5rem 1rem; border-radius: 6px; display: block; font-size: 1.1rem; font-weight: 600; color: #1f2937; }

    .btn-add-technician {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #8E6545 0%, #A67C5B 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(142,101,69,0.25);
    }
    .btn-add-technician:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(142,101,69,0.35); }
    .btn-add-technician svg { width: 18px; height: 18px; }

    .empty-state { text-align: center; padding: 4rem 2rem; color: #6b7280; }
    .empty-state svg { width: 64px; height: 64px; margin-bottom: 1rem; color: #d1d5db; }
    .empty-state h3 { color: #374151; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar"></aside>
    <main class="admin-main">
      <header class="admin-header">
        <h1>Technicians</h1>
        <div class="header-actions">
          <button class="btn-add-technician" onclick="openModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            Add Technician
          </button>
        </div>
      </header>
      <div class="admin-content">
        <div class="stats">
          <div class="stat-card"><h3>Total Technicians</h3><div class="value" id="stat-total">0</div></div>
          <div class="stat-card"><h3>Active</h3><div class="value" id="stat-active">0</div></div>
          <div class="stat-card"><h3>Pending Approval</h3><div class="value" id="stat-pending">0</div></div>
          <div class="stat-card"><h3>Completed Jobs</h3><div class="value" id="stat-jobs">0</div></div>
        </div>
        <div class="controls">
          <div style="display: flex; gap: 1rem;">
            <input type="text" class="search-box" id="searchInput" placeholder="Search technicians..." oninput="renderTechnicians()">
            <select class="filter-select" id="statusFilter" onchange="renderTechnicians()">
              <option value="">All Status</option>
              <option value="active">Active</option>
              <option value="pending">Pending</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="technicians-table">
          <table>
            <thead>
              <tr>
                <th>Technician</th>
                <th>Specialties</th>
                <th>Jobs</th>
                <th>Rating</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="techniciansBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Technician Modal -->
  <div class="modal" id="technicianModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add Technician</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form onsubmit="saveTechnician(event)">
        <div class="modal-body">
          <input type="hidden" id="technicianId">

          <div class="form-section">
            <div class="form-section-title">Contact Information</div>
            <div class="form-row">
              <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="techName" placeholder="Enter full name" required>
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="techEmail" placeholder="email@example.com" required>
              </div>
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" id="techPhone" placeholder="(555) 000-0000">
            </div>
          </div>

          <div class="form-section">
            <div class="form-section-title">Specialties</div>
            <div class="specialty-checkbox-group">
              <label class="specialty-checkbox">
                <input type="checkbox" name="specialties" value="roller-blinds">
                <span>Roller Blinds</span>
              </label>
              <label class="specialty-checkbox">
                <input type="checkbox" name="specialties" value="zebra-shades">
                <span>Zebra Shades</span>
              </label>
              <label class="specialty-checkbox">
                <input type="checkbox" name="specialties" value="roman-shades">
                <span>Roman Shades</span>
              </label>
              <label class="specialty-checkbox">
                <input type="checkbox" name="specialties" value="honeycomb">
                <span>Honeycomb Shades</span>
              </label>
              <label class="specialty-checkbox">
                <input type="checkbox" name="specialties" value="motorized">
                <span>Motorized Systems</span>
              </label>
              <label class="specialty-checkbox">
                <input type="checkbox" name="specialties" value="commercial">
                <span>Commercial Install</span>
              </label>
            </div>
          </div>

          <div class="form-section">
            <div class="form-section-title">Service Areas</div>
            <div class="form-group">
              <label>Service Areas (comma separated)</label>
              <input type="text" id="serviceAreas" placeholder="e.g., Los Angeles, Orange County, San Diego">
              <div class="input-hint">Enter zip codes or city names</div>
            </div>
          </div>

          <div class="form-section">
            <div class="form-section-title">Account Settings</div>
            <div class="form-row">
              <div class="form-group">
                <label>Status</label>
                <select id="techStatus">
                  <option value="pending">Pending Approval</option>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Notes</label>
              <textarea id="techNotes" rows="3" placeholder="Internal notes about this technician..."></textarea>
            </div>
          </div>

          <div id="tempPasswordBox" class="temp-password-box" style="display: none;">
            <h4>Temporary Password (share with technician)</h4>
            <code id="tempPasswordValue"></code>
          </div>

          <button type="submit" class="btn-submit">Save Technician</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = '/api/admin';
    let technicians = [];

    document.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('admin_token')) {
        window.location.href = '/admin/login.html';
        return;
      }
      AdminNavConfig.initSidebar('technicians');
      loadTechnicians();
    });

    async function apiCall(endpoint, method = 'GET', data = null) {
      const token = localStorage.getItem('admin_token');
      const options = {
        method,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        }
      };
      if (data) options.body = JSON.stringify(data);
      const response = await fetch(`${API_BASE}${endpoint}`, options);
      return response.json();
    }

    async function loadTechnicians() {
      try {
        const result = await apiCall('/technicians');
        if (result.success) {
          technicians = result.technicians;
          updateStats();
          renderTechnicians();
        }
      } catch (error) {
        console.error('Error loading technicians:', error);
      }
    }

    function updateStats() {
      document.getElementById('stat-total').textContent = technicians.length;
      document.getElementById('stat-active').textContent = technicians.filter(t => t.status === 'active').length;
      document.getElementById('stat-pending').textContent = technicians.filter(t => t.status === 'pending').length;
      document.getElementById('stat-jobs').textContent = technicians.reduce((sum, t) => sum + (t.completedJobs || 0), 0);
    }

    function renderTechnicians() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;

      let filtered = technicians.filter(t => {
        const matchSearch = t.name.toLowerCase().includes(search) || t.email.toLowerCase().includes(search);
        const matchStatus = !statusFilter || t.status === statusFilter;
        return matchSearch && matchStatus;
      });

      const tbody = document.getElementById('techniciansBody');

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6">
              <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <h3>No Technicians Found</h3>
                <p>Add your first technician to get started</p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(t => `
        <tr>
          <td>
            <div class="tech-cell">
              <div class="tech-avatar">${t.name.split(' ').map(n => n[0]).join('').toUpperCase()}</div>
              <div class="tech-info">
                <span class="tech-name">${t.name}</span>
                <span class="tech-email">${t.email}</span>
              </div>
            </div>
          </td>
          <td>
            <div class="specialty-tags">
              ${(t.specialties || []).slice(0, 3).map(s => `<span class="specialty-tag">${formatSpecialty(s)}</span>`).join('')}
              ${(t.specialties || []).length > 3 ? `<span class="specialty-tag">+${t.specialties.length - 3}</span>` : ''}
            </div>
          </td>
          <td>
            <strong>${t.completedJobs || 0}</strong>
            ${t.pendingJobs ? `<span style="color:#6b7280;font-size:0.85rem;"> (${t.pendingJobs} pending)</span>` : ''}
          </td>
          <td>
            <div class="rating-display">
              <span class="rating-stars">${getRatingStars(t.rating)}</span>
              <span class="rating-value">${(t.rating || 0).toFixed(1)}</span>
              <span class="rating-count">(${t.reviewCount || 0})</span>
            </div>
          </td>
          <td><span class="badge badge-${t.status}">${t.status}</span></td>
          <td>
            <button class="btn-action btn-edit" onclick="editTechnician('${t.id}')">Edit</button>
            <button class="btn-action btn-delete" onclick="deleteTechnician('${t.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function formatSpecialty(s) {
      return s.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }

    function getRatingStars(rating) {
      const fullStars = Math.floor(rating || 0);
      const hasHalf = (rating % 1) >= 0.5;
      let stars = '';
      for (let i = 0; i < fullStars; i++) stars += '\u2605';
      if (hasHalf) stars += '\u00BD';
      for (let i = stars.length; i < 5; i++) stars += '\u2606';
      return stars;
    }

    function openModal(technician = null) {
      document.getElementById('technicianId').value = technician ? technician.id : '';
      document.getElementById('techName').value = technician ? technician.name : '';
      document.getElementById('techEmail').value = technician ? technician.email : '';
      document.getElementById('techPhone').value = technician ? technician.phone : '';
      document.getElementById('serviceAreas').value = technician ? (technician.serviceAreas || []).join(', ') : '';
      document.getElementById('techStatus').value = technician ? technician.status : 'pending';
      document.getElementById('techNotes').value = technician ? technician.notes || '' : '';

      document.querySelectorAll('input[name="specialties"]').forEach(cb => {
        cb.checked = technician ? (technician.specialties || []).includes(cb.value) : false;
      });

      document.getElementById('tempPasswordBox').style.display = 'none';
      document.getElementById('modalTitle').textContent = technician ? 'Edit Technician' : 'Add Technician';
      document.getElementById('technicianModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('technicianModal').classList.remove('active');
    }

    function editTechnician(id) {
      const technician = technicians.find(t => t.id === id);
      if (technician) openModal(technician);
    }

    async function deleteTechnician(id) {
      const technician = technicians.find(t => t.id === id);
      if (!technician) return;

      if (!confirm(`Are you sure you want to delete ${technician.name}?`)) return;

      try {
        const result = await apiCall(`/technicians/${id}`, 'DELETE');
        if (result.success) {
          loadTechnicians();
        } else {
          alert(result.error || 'Failed to delete technician');
        }
      } catch (error) {
        alert('Failed to delete technician');
      }
    }

    async function saveTechnician(e) {
      e.preventDefault();

      const id = document.getElementById('technicianId').value;
      const specialties = Array.from(document.querySelectorAll('input[name="specialties"]:checked')).map(cb => cb.value);
      const serviceAreasRaw = document.getElementById('serviceAreas').value;
      const serviceAreas = serviceAreasRaw ? serviceAreasRaw.split(',').map(s => s.trim()).filter(s => s) : [];

      const data = {
        name: document.getElementById('techName').value,
        email: document.getElementById('techEmail').value,
        phone: document.getElementById('techPhone').value,
        specialties,
        serviceAreas,
        status: document.getElementById('techStatus').value,
        notes: document.getElementById('techNotes').value
      };

      try {
        const result = await apiCall(
          id ? `/technicians/${id}` : '/technicians',
          id ? 'PUT' : 'POST',
          data
        );

        if (result.success) {
          if (!id && result.tempPassword) {
            document.getElementById('tempPasswordValue').textContent = result.tempPassword;
            document.getElementById('tempPasswordBox').style.display = 'block';
            document.querySelector('.btn-submit').textContent = 'Close';
            document.querySelector('.btn-submit').onclick = (e) => {
              e.preventDefault();
              closeModal();
              loadTechnicians();
            };
          } else {
            closeModal();
            loadTechnicians();
          }
        } else {
          alert(result.error || 'Failed to save technician');
        }
      } catch (error) {
        alert('Failed to save technician');
      }
    }

    document.getElementById('technicianModal').addEventListener('click', e => {
      if (e.target.id === 'technicianModal') closeModal();
    });
  </script>
</body>
</html>
