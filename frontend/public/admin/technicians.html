<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technicians - Peekaboo Shades Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css?v=1737200003.0.26">
  <script src="/admin/js/adminNavConfig.js?v=1737200002"></script>
  <style>
    .tech-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .stat-card h3 {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      color: #8E6545;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      min-width: 300px;
    }
    .search-box input {
      border: none;
      outline: none;
      padding: 0.5rem;
      flex: 1;
    }
    .tech-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
    }
    .tech-card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .tech-header {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .tech-avatar {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #8E6545, #6B4D35);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
    }
    .tech-info h3 {
      font-size: 1.1rem;
      color: #333;
      margin: 0 0 0.25rem;
    }
    .tech-info .role {
      font-size: 0.85rem;
      color: #666;
    }
    .tech-status {
      margin-left: auto;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-active { background: #D1FAE5; color: #065F46; }
    .status-inactive { background: #FEE2E2; color: #991B1B; }
    .status-pending { background: #FEF3C7; color: #92400E; }
    .tech-details {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding: 1rem;
      background: #f9f9f9;
      border-radius: 8px;
    }
    .tech-detail {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #555;
    }
    .tech-detail svg {
      width: 16px;
      height: 16px;
      color: #8E6545;
    }
    .tech-detail strong {
      color: #333;
    }
    .tech-services {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .service-badge {
      background: #E8E4DF;
      color: #5C4033;
      padding: 0.25rem 0.75rem;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .tech-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .btn-action {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid #ddd;
      background: white;
      transition: all 0.2s;
    }
    .btn-action:hover { background: #f5f5f5; }
    .btn-edit { color: #8E6545; border-color: #8E6545; }
    .btn-edit:hover { background: #8E6545; color: white; }
    .btn-delete { color: #DC2626; border-color: #DC2626; }
    .btn-delete:hover { background: #DC2626; color: white; }
    .btn-portal { background: #8E6545; color: white; border-color: #8E6545; }
    .btn-portal:hover { background: #7A5639; }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white;
      border-radius: 16px;
      width: 95%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #eee;
    }
    .modal-header h2 {
      font-size: 1.25rem;
      color: #333;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #666;
    }
    .modal-body {
      padding: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #333;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .form-section {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #eee;
    }
    .form-section h3 {
      font-size: 1rem;
      color: #8E6545;
      margin-bottom: 1rem;
    }
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .checkbox-item input {
      width: 18px;
      height: 18px;
      accent-color: #8E6545;
    }
    .btn-submit {
      width: 100%;
      padding: 0.875rem;
      background: #8E6545;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
    }
    .btn-submit:hover { background: #7A5639; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar"></aside>
    <main class="admin-main">
      <header class="admin-header">
        <h1>Technicians</h1>
        <div class="header-actions">
          <button class="btn-primary" onclick="openModal()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Add Technician
          </button>
        </div>
      </header>

      <div class="admin-content">
        <div class="tech-stats">
          <div class="stat-card">
            <h3>Total Technicians</h3>
            <div class="value" id="stat-total">0</div>
          </div>
          <div class="stat-card">
            <h3>Active</h3>
            <div class="value" id="stat-active">0</div>
          </div>
          <div class="stat-card">
            <h3>Total Installations</h3>
            <div class="value" id="stat-installs">0</div>
          </div>
          <div class="stat-card">
            <h3>Avg Rating</h3>
            <div class="value" id="stat-rating">N/A</div>
          </div>
        </div>

        <div class="controls">
          <div class="search-box">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input type="text" placeholder="Search technicians..." id="searchInput" onkeyup="filterTechnicians()">
          </div>
        </div>

        <div class="tech-grid" id="techGrid">
          <div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: #666;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="64" height="64" style="margin: 0 auto 1rem; color: #ccc;">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            <h3>No Technicians</h3>
            <p>Add technicians to manage your installation team.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Technician Modal -->
  <div class="modal" id="techModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add Technician</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="techForm" onsubmit="saveTechnician(event)">
          <input type="hidden" name="id" id="techId">

          <div class="form-row">
            <div class="form-group">
              <label>First Name *</label>
              <input type="text" name="firstName" required placeholder="John">
            </div>
            <div class="form-group">
              <label>Last Name *</label>
              <input type="text" name="lastName" required placeholder="Smith">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Email *</label>
              <input type="email" name="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
              <label>Phone *</label>
              <input type="tel" name="phone" required placeholder="(555) 123-4567">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Status</label>
              <select name="status">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="pending">Pending Approval</option>
              </select>
            </div>
            <div class="form-group">
              <label>Hourly Rate ($)</label>
              <input type="number" name="hourlyRate" min="0" step="0.01" placeholder="35.00">
            </div>
          </div>

          <div class="form-section">
            <h3>Service Areas</h3>
            <div class="form-group">
              <label>Assigned ZIP Codes</label>
              <textarea name="zipCodes" rows="2" placeholder="90001, 90002, 90003..."></textarea>
            </div>
          </div>

          <div class="form-section">
            <h3>Services Offered</h3>
            <div class="checkbox-group">
              <label class="checkbox-item">
                <input type="checkbox" name="services" value="roller">
                Roller Shades
              </label>
              <label class="checkbox-item">
                <input type="checkbox" name="services" value="zebra">
                Zebra Shades
              </label>
              <label class="checkbox-item">
                <input type="checkbox" name="services" value="roman">
                Roman Shades
              </label>
              <label class="checkbox-item">
                <input type="checkbox" name="services" value="honeycomb">
                Honeycomb Shades
              </label>
              <label class="checkbox-item">
                <input type="checkbox" name="services" value="motorized">
                Motorized Installation
              </label>
            </div>
          </div>

          <div class="form-section">
            <h3>Payment Information</h3>
            <div class="form-group">
              <label>Payment Method</label>
              <select name="paymentMethod">
                <option value="direct_deposit">Direct Deposit</option>
                <option value="check">Check</option>
                <option value="paypal">PayPal</option>
                <option value="venmo">Venmo</option>
              </select>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Bank Name / Account</label>
                <input type="text" name="bankName" placeholder="Bank of America">
              </div>
              <div class="form-group">
                <label>Account Last 4 Digits</label>
                <input type="text" name="accountLast4" maxlength="4" placeholder="1234">
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" rows="2" placeholder="Additional notes..."></textarea>
          </div>

          <button type="submit" class="btn-submit">Save Technician</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const Admin = {
      API: {
        async get(endpoint) {
          const token = localStorage.getItem('admin_token');
          const response = await fetch(endpoint, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          return response.json();
        },
        async post(endpoint, data) {
          const token = localStorage.getItem('admin_token');
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          return response.json();
        },
        async put(endpoint, data) {
          const token = localStorage.getItem('admin_token');
          const response = await fetch(endpoint, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          return response.json();
        },
        async delete(endpoint) {
          const token = localStorage.getItem('admin_token');
          const response = await fetch(endpoint, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          return response.json();
        }
      },
      Toast: {
        show(message, type = 'success') {
          alert(message);
        }
      }
    };

    let technicians = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('admin_token');
      if (!token) {
        window.location.href = '/admin/login.html';
        return;
      }
      AdminNavConfig.initSidebar('technicians');
      await loadData();
    });

    async function loadData() {
      try {
        const result = await Admin.API.get('/api/admin/technicians');
        technicians = result.success ? (result.technicians || result.data || []) : [];
        updateStats();
        renderTechnicians();
      } catch (error) {
        console.error('Error loading technicians:', error);
      }
    }

    function updateStats() {
      const active = technicians.filter(t => t.status === 'active').length;
      const totalInstalls = technicians.reduce((sum, t) => sum + (t.installCount || 0), 0);
      const ratings = technicians.filter(t => t.rating).map(t => t.rating);
      const avgRating = ratings.length > 0 ? (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1) : 'N/A';

      document.getElementById('stat-total').textContent = technicians.length;
      document.getElementById('stat-active').textContent = active;
      document.getElementById('stat-installs').textContent = totalInstalls;
      document.getElementById('stat-rating').textContent = avgRating;
    }

    function renderTechnicians() {
      const container = document.getElementById('techGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();

      let filtered = technicians;
      if (search) {
        filtered = technicians.filter(t =>
          `${t.firstName} ${t.lastName}`.toLowerCase().includes(search) ||
          (t.email && t.email.toLowerCase().includes(search)) ||
          (t.phone && t.phone.includes(search))
        );
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: #666;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="64" height="64" style="margin: 0 auto 1rem; color: #ccc;">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            <h3>${search ? 'No Technicians Found' : 'No Technicians'}</h3>
            <p>${search ? 'Try a different search term.' : 'Add technicians to manage your installation team.'}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(tech => {
        const initials = `${(tech.firstName || 'T').charAt(0)}${(tech.lastName || '').charAt(0)}`;
        const services = tech.services || [];

        return `
          <div class="tech-card">
            <div class="tech-header">
              <div class="tech-avatar">${initials}</div>
              <div class="tech-info">
                <h3>${tech.firstName} ${tech.lastName}</h3>
                <div class="role">Installation Technician</div>
              </div>
              <span class="tech-status status-${tech.status || 'active'}">${tech.status || 'Active'}</span>
            </div>
            <div class="tech-details">
              <div class="tech-detail">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                ${tech.email || 'No email'}
              </div>
              <div class="tech-detail">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                </svg>
                ${tech.phone || 'No phone'}
              </div>
              <div class="tech-detail">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1" />
                </svg>
                <strong>$${tech.hourlyRate || '0'}/hr</strong> • ${tech.paymentMethod || 'Direct Deposit'}
              </div>
              <div class="tech-detail">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <strong>${tech.installCount || 0}</strong> Installations
              </div>
            </div>
            ${services.length > 0 ? `
            <div class="tech-services">
              ${services.map(s => `<span class="service-badge">${formatService(s)}</span>`).join('')}
            </div>
            ` : ''}
            <div class="tech-actions">
              <button class="btn-action btn-portal" onclick="openPortal('${tech.id}')">Portal Access</button>
              <button class="btn-action btn-edit" onclick="editTechnician('${tech.id}')">Edit</button>
              <button class="btn-action btn-delete" onclick="deleteTechnician('${tech.id}')">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function formatService(service) {
      const services = {
        roller: 'Roller Shades',
        zebra: 'Zebra Shades',
        roman: 'Roman Shades',
        honeycomb: 'Honeycomb',
        motorized: 'Motorized'
      };
      return services[service] || service;
    }

    function filterTechnicians() {
      renderTechnicians();
    }

    function openModal(tech = null) {
      const form = document.getElementById('techForm');
      form.reset();
      document.getElementById('techId').value = '';
      document.getElementById('modalTitle').textContent = 'Add Technician';

      // Uncheck all service checkboxes
      document.querySelectorAll('input[name="services"]').forEach(cb => cb.checked = false);

      if (tech) {
        document.getElementById('modalTitle').textContent = 'Edit Technician';
        document.getElementById('techId').value = tech.id;
        form.firstName.value = tech.firstName || '';
        form.lastName.value = tech.lastName || '';
        form.email.value = tech.email || '';
        form.phone.value = tech.phone || '';
        form.status.value = tech.status || 'active';
        form.hourlyRate.value = tech.hourlyRate || '';
        form.zipCodes.value = tech.zipCodes || '';
        form.paymentMethod.value = tech.paymentMethod || 'direct_deposit';
        form.bankName.value = tech.bankName || '';
        form.accountLast4.value = tech.accountLast4 || '';
        form.notes.value = tech.notes || '';

        // Check services
        (tech.services || []).forEach(s => {
          const cb = document.querySelector(`input[name="services"][value="${s}"]`);
          if (cb) cb.checked = true;
        });
      }

      document.getElementById('techModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('techModal').classList.remove('active');
    }

    function editTechnician(id) {
      const tech = technicians.find(t => t.id === id);
      if (tech) openModal(tech);
    }

    async function saveTechnician(event) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      const id = formData.get('id');

      // Get checked services
      const services = [];
      document.querySelectorAll('input[name="services"]:checked').forEach(cb => {
        services.push(cb.value);
      });

      const data = {
        firstName: formData.get('firstName'),
        lastName: formData.get('lastName'),
        email: formData.get('email'),
        phone: formData.get('phone'),
        status: formData.get('status'),
        hourlyRate: parseFloat(formData.get('hourlyRate')) || 0,
        zipCodes: formData.get('zipCodes'),
        services: services,
        paymentMethod: formData.get('paymentMethod'),
        bankName: formData.get('bankName'),
        accountLast4: formData.get('accountLast4'),
        notes: formData.get('notes')
      };

      try {
        let result;
        if (id) {
          result = await Admin.API.put(`/api/admin/technicians/${id}`, data);
        } else {
          result = await Admin.API.post('/api/admin/technicians', data);
        }

        if (result.success) {
          Admin.Toast.show(id ? 'Technician updated' : 'Technician added');
          closeModal();
          await loadData();
        } else {
          Admin.Toast.show(result.error || 'Error saving technician', 'error');
        }
      } catch (error) {
        Admin.Toast.show('Error saving technician', 'error');
      }
    }

    async function deleteTechnician(id) {
      if (!confirm('Are you sure you want to delete this technician?')) return;

      try {
        const result = await Admin.API.delete(`/api/admin/technicians/${id}`);
        if (result.success) {
          Admin.Toast.show('Technician deleted');
          await loadData();
        } else {
          Admin.Toast.show(result.error || 'Error deleting technician', 'error');
        }
      } catch (error) {
        Admin.Toast.show('Error deleting technician', 'error');
      }
    }

    function openPortal(id) {
      const tech = technicians.find(t => t.id === id);
      if (tech) {
        // Open technician portal in new tab
        window.open(`/technician/?id=${id}`, '_blank');
      }
    }

    document.getElementById('techModal').addEventListener('click', (e) => {
      if (e.target.id === 'techModal') closeModal();
    });
  </script>
</body>
</html>
