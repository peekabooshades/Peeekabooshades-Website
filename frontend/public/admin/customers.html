<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers - Peekaboo Shades Admin</title>
  <link rel="stylesheet" href="css/admin.css?v=1737200003">
  <link rel="icon" type="image/jpeg" href="/images/peekabooshades_logo.jpeg">
  <style>
    .customer-filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-group label {
      font-size: 13px;
      color: #6D7175;
    }
    .customer-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #8E6545;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
    }
    .customer-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .customer-name {
      font-weight: 500;
      color: #202223;
    }
    .customer-email {
      font-size: 13px;
      color: #6D7175;
    }
    .customer-type-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .customer-type-badge.retail {
      background: #E8F4FD;
      color: #2C6ECB;
    }
    .customer-type-badge.designer {
      background: #F3E8FF;
      color: #7C3AED;
    }
    .customer-type-badge.contractor {
      background: #FFF5EA;
      color: #B98900;
    }
    .customer-stats {
      text-align: right;
    }
    .customer-stats-value {
      font-weight: 600;
      color: #202223;
    }
    .customer-stats-label {
      font-size: 12px;
      color: #6D7175;
    }
    .customer-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .customer-tag {
      padding: 2px 8px;
      background: #F6F6F7;
      border-radius: 4px;
      font-size: 11px;
      color: #6D7175;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }
    .empty-state svg {
      width: 64px;
      height: 64px;
      color: #8C9196;
      margin-bottom: 16px;
    }
    .empty-state h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #202223;
    }
    .empty-state p {
      color: #6D7175;
      margin-bottom: 20px;
    }
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding: 16px 0;
      border-top: 1px solid #E5E5E5;
    }
    .pagination-info {
      font-size: 14px;
      color: #6D7175;
    }
    .pagination-btns {
      display: flex;
      gap: 8px;
    }
    .pagination-btn {
      padding: 8px 16px;
      border: 1px solid #E5E5E5;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .pagination-btn:hover:not(:disabled) {
      border-color: #8E6545;
    }
    .pagination-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .bulk-actions {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #F6F6F7;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .bulk-actions.visible {
      display: flex;
    }
    .bulk-actions span {
      font-size: 14px;
      color: #6D7175;
    }
    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active {
      display: flex;
    }
    .modal .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
    }
    .modal .modal-content {
      position: relative;
      background: white;
      border-radius: 12px;
      max-height: 90vh;
      overflow-y: auto;
      z-index: 1;
    }
    .modal .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #E5E5E5;
    }
    .modal .modal-header h2 {
      margin: 0;
      font-size: 18px;
    }
    .modal .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #6D7175;
    }
    .modal .modal-body {
      padding: 20px;
    }
    .modal .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid #E5E5E5;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 14px;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #E5E5E5;
      border-radius: 8px;
      font-size: 14px;
    }
    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: #8E6545;
    }
    /* Button styles */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #8E6545;
      color: white;
      border-color: #8E6545;
    }
    .btn-primary:hover {
      background: #7a5639;
    }
    .btn-secondary {
      background: white;
      color: #333;
      border-color: #E5E5E5;
    }
    .btn-secondary:hover {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar (dynamically populated by adminNavConfig.js) -->
    <aside class="admin-sidebar">
      <!-- Sidebar content will be injected dynamically -->
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <!-- Header -->
      <header class="admin-header">
        <div class="header-left">
          <button class="header-btn mobile-menu-btn" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <div class="breadcrumb">
            <a href="/admin/" class="breadcrumb-link">Dashboard</a>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-current">Customers</span>
          </div>
        </div>
        <div class="header-right">
          <a href="/" class="header-btn" title="View Store" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
          </a>
          <div class="dropdown">
            <div class="header-profile">
              <div class="profile-avatar">A</div>
              <span class="profile-name">Admin</span>
            </div>
            <div class="dropdown-menu profile-dropdown">
              <a href="/admin/settings.html" class="dropdown-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                Profile
              </a>
              <div class="dropdown-divider"></div>
              <a href="#" class="dropdown-item danger" onclick="Admin.AuthAPI.logout(); return false;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Logout
              </a>
            </div>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <div class="admin-content">
        <div class="page-header">
          <h1 class="page-title">Customers</h1>
          <button class="btn btn-primary" onclick="showAddCustomerModal()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Add Customer
          </button>
        </div>

        <!-- Filters -->
        <div class="customer-filters">
          <div class="search-box" style="flex: 1; max-width: 400px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input type="text" id="searchInput" placeholder="Search customers...">
          </div>
          <div class="filter-group">
            <label>Type:</label>
            <select id="typeFilter" class="form-select" style="min-width: 140px;">
              <option value="">All Types</option>
              <option value="retail">Retail</option>
              <option value="designer">Designer</option>
              <option value="contractor">Contractor</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Sort:</label>
            <select id="sortFilter" class="form-select" style="min-width: 160px;">
              <option value="recent">Recently Added</option>
              <option value="name">Name A-Z</option>
              <option value="spent_desc">Highest Spent</option>
              <option value="spent_asc">Lowest Spent</option>
              <option value="orders_desc">Most Orders</option>
            </select>
          </div>
          <button class="btn btn-secondary" onclick="exportCustomers()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            Export
          </button>
        </div>

        <!-- Bulk Actions -->
        <div class="bulk-actions" id="bulkActions">
          <span><strong id="selectedCount">0</strong> selected</span>
          <button class="btn btn-secondary btn-sm" onclick="bulkAddTag()">Add Tag</button>
          <button class="btn btn-secondary btn-sm" onclick="bulkChangeType()">Change Type</button>
          <button class="btn btn-danger btn-sm" onclick="bulkDelete()">Delete</button>
          <button class="btn btn-secondary btn-sm" onclick="clearSelection()">Clear</button>
        </div>

        <!-- Customers Table -->
        <div class="card">
          <div class="table-container" style="overflow-x: auto;">
            <table class="admin-table" style="width: 100%; border-collapse: collapse; border: 2px solid #8E6545; min-width: 900px;">
              <thead>
                <tr style="background: #8E6545; color: white;">
                  <th style="width: 40px; padding: 12px; border: 1px solid #ddd;">
                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                  </th>
                  <th style="padding: 12px; border: 1px solid #ddd; text-align: left;">NAME</th>
                  <th style="padding: 12px; border: 1px solid #ddd; text-align: left;">EMAIL</th>
                  <th style="padding: 12px; border: 1px solid #ddd; text-align: left;">PHONE</th>
                  <th style="padding: 12px; border: 1px solid #ddd; text-align: left;">TYPE</th>
                  <th style="padding: 12px; border: 1px solid #ddd; text-align: left;">COMPANY</th>
                  <th style="padding: 12px; border: 1px solid #ddd; text-align: center;">ORDERS</th>
                  <th style="padding: 12px; border: 1px solid #ddd; text-align: right;">TOTAL SPENT</th>
                  <th style="width: 80px; padding: 12px; border: 1px solid #ddd;"></th>
                </tr>
              </thead>
              <tbody id="customersTable">
                <tr>
                  <td colspan="9" style="text-align: center; padding: 40px; border: 1px solid #ddd;">
                    Loading customers...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="pagination">
            <div class="pagination-info" id="paginationInfo">
              Showing 0 customers
            </div>
            <div class="pagination-btns">
              <button class="pagination-btn" id="prevBtn" onclick="prevPage()" disabled>Previous</button>
              <button class="pagination-btn" id="nextBtn" onclick="nextPage()" disabled>Next</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Customer Modal -->
  <div class="modal" id="customerModal">
    <div class="modal-overlay" onclick="closeModal()"></div>
    <div class="modal-content" style="max-width: 600px;">
      <div class="modal-header">
        <h2 id="modalTitle">Add Customer</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="customerForm" onsubmit="saveCustomer(event)">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">First Name *</label>
              <input type="text" class="form-input" id="firstName" required>
            </div>
            <div class="form-group">
              <label class="form-label">Last Name *</label>
              <input type="text" class="form-input" id="lastName" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Email *</label>
            <input type="email" class="form-input" id="email" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-input" id="phone">
            </div>
            <div class="form-group">
              <label class="form-label">Customer Type</label>
              <select class="form-select" id="customerType">
                <option value="retail">Retail</option>
                <option value="designer">Designer</option>
                <option value="contractor">Contractor</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Company Name</label>
            <input type="text" class="form-input" id="companyName">
          </div>
          <div class="form-group">
            <label class="form-label">Tags (comma separated)</label>
            <input type="text" class="form-input" id="tags" placeholder="vip, wholesale, priority">
          </div>
          <div class="form-group">
            <label class="form-label">Notes</label>
            <textarea class="form-input" id="notes" rows="3" placeholder="Internal notes about this customer..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Customer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/adminNavConfig.js?v=1737200002"></script>
  <script src="js/admin.js?v=1737100001"></script>
  <script>
    let customers = [];
    let currentPage = 1;
    const perPage = 20;
    let selectedCustomers = new Set();
    let editingCustomerId = null;

    document.addEventListener('DOMContentLoaded', () => {
      // Require authentication
      if (!localStorage.getItem('admin_token')) {
        window.location.href = '/admin/login.html';
        return;
      }

      // Initialize sidebar
      AdminNavConfig.initSidebar('customers');

      // Load customers
      loadCustomers();

      // Check for action in URL
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('action') === 'new') {
        showAddCustomerModal();
      }

      // Event listeners
      document.getElementById('searchInput').addEventListener('input', debounce(loadCustomers, 300));
      document.getElementById('typeFilter').addEventListener('change', loadCustomers);
      document.getElementById('sortFilter').addEventListener('change', loadCustomers);
    });

    async function loadCustomers() {
      const search = document.getElementById('searchInput').value || '';
      const type = document.getElementById('typeFilter').value || '';
      const sort = document.getElementById('sortFilter').value || 'recent';

      // Show loading state
      document.getElementById('customersTable').innerHTML = `
        <tr><td colspan="9" style="text-align: center; padding: 40px; border: 1px solid #ddd;">
          Loading customers...
        </td></tr>`;

      try {
        const token = localStorage.getItem('admin_token');
        const params = new URLSearchParams({
          page: currentPage,
          limit: perPage
        });
        if (search) params.append('search', search);
        if (type) params.append('type', type);
        if (sort) params.append('sort', sort);

        const response = await fetch(`/api/admin/customers?${params}`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        const data = await response.json();
        console.log('Customers API response:', data);

        if (data.success) {
          customers = data.customers || [];
          renderCustomers();
          updatePagination(data.total || customers.length);
        } else {
          throw new Error(data.error || 'Failed to load customers');
        }
      } catch (error) {
        console.error('Failed to load customers:', error);
        document.getElementById('customersTable').innerHTML = `
          <tr><td colspan="9" style="text-align: center; padding: 40px; border: 1px solid #ddd; color: #dc3545;">
            Error loading customers: ${error.message}
            <br><button class="btn btn-primary" style="margin-top: 10px;" onclick="loadCustomers()">Try Again</button>
          </td></tr>`;
      }
    }

    function renderCustomers() {
      const tbody = document.getElementById('customersTable');

      if (!customers || customers.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="9" style="border: 1px solid #ddd;">
              <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <h3>No customers yet</h3>
                <p>Add your first customer to get started</p>
                <button class="btn btn-primary" onclick="showAddCustomerModal()">Add Customer</button>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = customers.map(customer => {
        const fullName = `${customer.firstName || ''} ${customer.lastName || ''}`.trim();

        return `
          <tr style="background: white;">
            <td style="padding: 12px; border: 1px solid #ddd; text-align: center;">
              <input type="checkbox" class="customer-checkbox" value="${customer.id}"
                ${selectedCustomers.has(customer.id) ? 'checked' : ''}
                onchange="toggleCustomerSelection('${customer.id}')">
            </td>
            <td style="padding: 12px; border: 1px solid #ddd;">
              <a href="/admin/customer.html?id=${customer.id}" style="color: #2c6ecb; text-decoration: none; font-weight: 500;">
                ${Admin.Utils.escapeHtml(fullName)}
              </a>
            </td>
            <td style="padding: 12px; border: 1px solid #ddd;">${Admin.Utils.escapeHtml(customer.email)}</td>
            <td style="padding: 12px; border: 1px solid #ddd;">${customer.phone ? Admin.Utils.escapeHtml(customer.phone) : '-'}</td>
            <td style="padding: 12px; border: 1px solid #ddd;">
              <span class="customer-type-badge ${customer.type || 'retail'}">
                ${capitalizeFirst(customer.type || 'retail')}
              </span>
            </td>
            <td style="padding: 12px; border: 1px solid #ddd;">${customer.companyName ? Admin.Utils.escapeHtml(customer.companyName) : '-'}</td>
            <td style="padding: 12px; border: 1px solid #ddd; text-align: center; font-weight: 600;">${customer.totalOrders || 0}</td>
            <td style="padding: 12px; border: 1px solid #ddd; text-align: right; font-weight: 600;">${Admin.Utils.formatCurrency(customer.totalSpent || 0)}</td>
            <td style="padding: 12px; border: 1px solid #ddd;">
              <div class="dropdown">
                <button class="btn btn-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                  </svg>
                </button>
                <div class="dropdown-menu">
                  <a href="/admin/customer.html?id=${customer.id}" class="dropdown-item">View Details</a>
                  <a href="#" class="dropdown-item" onclick="editCustomer('${customer.id}'); return false;">Edit</a>
                  <div class="dropdown-divider"></div>
                  <a href="#" class="dropdown-item danger" onclick="deleteCustomer('${customer.id}'); return false;">Delete</a>
                </div>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function updatePagination(total) {
      const start = (currentPage - 1) * perPage + 1;
      const end = Math.min(currentPage * perPage, total);
      const totalPages = Math.ceil(total / perPage);

      document.getElementById('paginationInfo').textContent =
        `Showing ${start}-${end} of ${total} customers`;

      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        loadCustomers();
      }
    }

    function nextPage() {
      currentPage++;
      loadCustomers();
    }

    function getInitials(firstName, lastName) {
      return ((firstName || '').charAt(0) + (lastName || '').charAt(0)).toUpperCase() || '?';
    }

    function capitalizeFirst(str) {
      return str ? str.charAt(0).toUpperCase() + str.slice(1) : '';
    }

    // Selection handling
    function toggleSelectAll() {
      const selectAll = document.getElementById('selectAll');
      const checkboxes = document.querySelectorAll('.customer-checkbox');

      checkboxes.forEach(cb => {
        cb.checked = selectAll.checked;
        if (selectAll.checked) {
          selectedCustomers.add(cb.value);
        } else {
          selectedCustomers.delete(cb.value);
        }
      });

      updateBulkActions();
    }

    function toggleCustomerSelection(id) {
      if (selectedCustomers.has(id)) {
        selectedCustomers.delete(id);
      } else {
        selectedCustomers.add(id);
      }
      updateBulkActions();
    }

    function updateBulkActions() {
      const bulkActions = document.getElementById('bulkActions');
      const selectedCount = document.getElementById('selectedCount');

      if (selectedCustomers.size > 0) {
        bulkActions.classList.add('visible');
        selectedCount.textContent = selectedCustomers.size;
      } else {
        bulkActions.classList.remove('visible');
      }
    }

    function clearSelection() {
      selectedCustomers.clear();
      document.getElementById('selectAll').checked = false;
      document.querySelectorAll('.customer-checkbox').forEach(cb => cb.checked = false);
      updateBulkActions();
    }

    // Modal handling
    function showAddCustomerModal() {
      editingCustomerId = null;
      document.getElementById('modalTitle').textContent = 'Add Customer';
      document.getElementById('customerForm').reset();
      document.getElementById('customerModal').classList.add('active');
    }

    function editCustomer(id) {
      const customer = customers.find(c => c.id === id);
      if (!customer) return;

      editingCustomerId = id;
      document.getElementById('modalTitle').textContent = 'Edit Customer';
      document.getElementById('firstName').value = customer.firstName || '';
      document.getElementById('lastName').value = customer.lastName || '';
      document.getElementById('email').value = customer.email || '';
      document.getElementById('phone').value = customer.phone || '';
      document.getElementById('customerType').value = customer.type || 'retail';
      document.getElementById('companyName').value = customer.companyName || '';
      document.getElementById('tags').value = (customer.tags || []).join(', ');
      document.getElementById('notes').value = customer.notes || '';
      document.getElementById('customerModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('customerModal').classList.remove('active');
      editingCustomerId = null;
    }

    async function saveCustomer(e) {
      e.preventDefault();

      const tagsInput = document.getElementById('tags').value;
      const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : [];

      const customerData = {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        type: document.getElementById('customerType').value,
        companyName: document.getElementById('companyName').value,
        tags,
        notes: document.getElementById('notes').value
      };

      try {
        const token = localStorage.getItem('admin_token');
        const url = editingCustomerId
          ? `/api/admin/customers/${editingCustomerId}`
          : '/api/admin/customers';
        const method = editingCustomerId ? 'PUT' : 'POST';

        const response = await fetch(url, {
          method,
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(customerData)
        });

        const data = await response.json();

        if (data.success) {
          alert(editingCustomerId ? 'Customer updated!' : 'Customer added!');
          closeModal();
          loadCustomers();
        } else {
          alert('Error: ' + (data.error || 'Failed to save customer'));
        }
      } catch (error) {
        console.error('Failed to save customer:', error);
        alert('Failed to save customer: ' + error.message);
      }
    }

    async function deleteCustomer(id) {
      if (!confirm('Are you sure you want to delete this customer?')) return;

      try {
        const token = localStorage.getItem('admin_token');
        const response = await fetch(`/api/admin/customers/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        const data = await response.json();
        if (data.success) {
          alert('Customer deleted');
          loadCustomers();
        } else {
          alert('Error: ' + (data.error || 'Failed to delete customer'));
        }
      } catch (error) {
        console.error('Failed to delete customer:', error);
        alert('Failed to delete customer: ' + error.message);
      }
    }

    // Bulk actions
    async function bulkDelete() {
      if (!confirm(`Are you sure you want to delete ${selectedCustomers.size} customers?`)) return;

      try {
        const token = localStorage.getItem('admin_token');
        for (const id of selectedCustomers) {
          await fetch(`/api/admin/customers/${id}`, {
            method: 'DELETE',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            }
          });
        }
        alert(`${selectedCustomers.size} customers deleted`);
        clearSelection();
        loadCustomers();
      } catch (error) {
        console.error('Failed to delete customers:', error);
        alert('Failed to delete some customers');
      }
    }

    function bulkAddTag() {
      const tag = prompt('Enter tag to add:');
      if (!tag) return;

      // Would need bulk update API
      Admin.Toast.info('Bulk tag update would be added here');
    }

    function bulkChangeType() {
      const type = prompt('Enter new type (retail, designer, contractor):');
      if (!type || !['retail', 'designer', 'contractor'].includes(type)) {
        Admin.Toast.error('Invalid customer type');
        return;
      }

      // Would need bulk update API
      Admin.Toast.info('Bulk type update would be added here');
    }

    function exportCustomers() {
      let csvContent = 'First Name,Last Name,Email,Phone,Type,Company,Tags,Total Orders,Total Spent\n';

      customers.forEach(c => {
        csvContent += `"${c.firstName || ''}","${c.lastName || ''}","${c.email || ''}","${c.phone || ''}","${c.type || 'retail'}","${c.companyName || ''}","${(c.tags || []).join('; ')}",${c.totalOrders || 0},${c.totalSpent || 0}\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'customers.csv';
      a.click();
      window.URL.revokeObjectURL(url);
      Admin.Toast.success('Customers exported');
    }

    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }
  </script>
</body>
</html>
