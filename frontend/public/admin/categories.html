<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories - Peekaboo Shades Admin</title>
  <link rel="stylesheet" href="css/admin.css?v=1737200003">
  <link rel="icon" type="image/jpeg" href="/images/peekabooshades_logo.jpeg">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar (dynamically populated by adminNavConfig.js) -->
    <aside class="admin-sidebar">
      <!-- Sidebar content will be injected dynamically -->
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <!-- Header -->
      <header class="admin-header">
        <div class="header-left">
          <div class="breadcrumb">
            <a href="/admin/">Dashboard</a>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-current">Categories</span>
          </div>
        </div>
        <div class="header-right">
          <div class="dropdown">
            <div class="header-profile">
              <div class="profile-avatar">A</div>
              <span class="profile-name">Admin</span>
            </div>
            <div class="dropdown-menu profile-dropdown">
              <a href="/admin/settings.html" class="dropdown-item">Profile</a>
              <div class="dropdown-divider"></div>
              <a href="#" class="dropdown-item danger" onclick="Admin.AuthAPI.logout(); return false;">Logout</a>
            </div>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <div class="admin-content">
        <div class="page-header">
          <h1 class="page-title">Categories</h1>
          <div class="page-actions">
            <button class="btn btn-primary" onclick="openModal()">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
              </svg>
              Add Category
            </button>
          </div>
        </div>

        <!-- Categories Table -->
        <div class="card">
          <div class="table-container">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Slug</th>
                  <th>Description</th>
                  <th>Products</th>
                  <th style="width: 120px;">Actions</th>
                </tr>
              </thead>
              <tbody id="categories-table">
                <tr>
                  <td colspan="5" style="text-align: center; padding: 60px;">
                    <div class="spinner"></div>
                    <p style="margin-top: 16px; color: var(--admin-text-secondary);">Loading categories...</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Category Modal -->
  <div class="modal-overlay" id="category-modal">
    <div class="modal" style="max-width: 500px;">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Add Category</h3>
        <button class="modal-close" onclick="closeModal()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <form id="category-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="cat-name">Category Name *</label>
            <input type="text" class="form-input" id="cat-name" required placeholder="e.g., Roller Shades">
          </div>
          <div class="form-group">
            <label class="form-label" for="cat-slug">URL Slug *</label>
            <input type="text" class="form-input" id="cat-slug" required placeholder="e.g., roller-shades">
            <p class="form-help">Auto-generated from name if left empty</p>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="cat-description">Description</label>
            <textarea class="form-textarea" id="cat-description" placeholder="Brief description of this category"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/adminNavConfig.js?v=1737200002"></script>
  <script src="js/admin.js?v=1737100001"></script>
  <script>
    // Require authentication
    if (!Admin.Auth.requireAuth()) {
      // Will redirect
    } else {
      loadCategories();
    }

    let allCategories = [];
    let editingId = null;

    async function loadCategories() {
      try {
        const data = await Admin.CategoriesAPI.getAll();
        if (data.success) {
          allCategories = data.data || data.categories || [];
          renderCategories(allCategories);
        }
      } catch (error) {
        console.error('Failed to load categories:', error);
        Admin.Toast.error('Failed to load categories');
      }
    }

    function renderCategories(categories) {
      const tbody = document.getElementById('categories-table');

      if (!categories || categories.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="empty-state">
              <svg xmlns="http://www.w3.org/2000/svg" class="empty-state-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
              </svg>
              <h3 class="empty-state-title">No categories</h3>
              <p class="empty-state-text">Create your first category to organize products</p>
              <button class="btn btn-primary" onclick="openModal()">Add Category</button>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = categories.map(cat => `
        <tr data-id="${cat.id}">
          <td style="font-weight: 500;">${Admin.Utils.escapeHtml(cat.name)}</td>
          <td style="color: var(--admin-text-secondary);">${cat.slug}</td>
          <td>${Admin.Utils.escapeHtml(cat.description || '-')}</td>
          <td>${cat.product_count || 0}</td>
          <td>
            <div class="action-buttons">
              <button class="action-btn" title="Edit" onclick="editCategory('${cat.id}')">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
              </button>
              <button class="action-btn danger" title="Delete" onclick="deleteCategory('${cat.id}', '${Admin.Utils.escapeHtml(cat.name)}')">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function openModal(category = null) {
      editingId = category ? category.id : null;
      document.getElementById('modal-title').textContent = category ? 'Edit Category' : 'Add Category';
      document.getElementById('save-btn').textContent = category ? 'Update Category' : 'Save Category';

      document.getElementById('cat-name').value = category ? category.name : '';
      document.getElementById('cat-slug').value = category ? category.slug : '';
      document.getElementById('cat-description').value = category ? category.description || '' : '';

      Admin.Modal.show('category-modal');
    }

    function closeModal() {
      Admin.Modal.hide('category-modal');
      editingId = null;
    }

    function editCategory(id) {
      const category = allCategories.find(c => c.id === id);
      if (category) {
        openModal(category);
      }
    }

    async function deleteCategory(id, name) {
      const confirmed = await Admin.Modal.confirm(
        'Delete Category',
        `Are you sure you want to delete "${name}"? Products in this category will become uncategorized.`
      );

      if (confirmed) {
        try {
          await Admin.CategoriesAPI.delete(id);
          allCategories = allCategories.filter(c => c.id !== id);
          renderCategories(allCategories);
          Admin.Toast.success('Category deleted successfully');
        } catch (error) {
          Admin.Toast.error('Failed to delete category');
        }
      }
    }

    // Auto-generate slug
    document.getElementById('cat-name').addEventListener('input', function() {
      if (!editingId) {
        document.getElementById('cat-slug').value = Admin.Utils.slugify(this.value);
      }
    });

    // Form submission
    document.getElementById('category-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const formData = {
        name: document.getElementById('cat-name').value.trim(),
        slug: document.getElementById('cat-slug').value.trim(),
        description: document.getElementById('cat-description').value.trim()
      };

      try {
        if (editingId) {
          await Admin.CategoriesAPI.update(editingId, formData);
          Admin.Toast.success('Category updated successfully');
        } else {
          await Admin.CategoriesAPI.create(formData);
          Admin.Toast.success('Category created successfully');
        }
        closeModal();
        loadCategories();
      } catch (error) {
        Admin.Toast.error(error.message || 'Failed to save category');
      }
    });
  </script>
</body>
</html>
