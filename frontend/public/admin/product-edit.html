<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting… — Peekaboo Shades Admin</title>
  <link rel="icon" type="image/jpeg" href="/images/peekabooshades_logo.jpeg">
  <!--
    BUG-A001: this legacy stub editor (12 fields) is deprecated. The canonical
    product editor is /admin/product-editor.html (functional saveProduct(),
    full data model, linked from the products list). This page now redirects
    there, preserving any ?id= query so deep links keep working. Original file
    kept in git history for rollback.
  -->
  <meta http-equiv="refresh" content="0; url=/admin/product-editor.html">
  <script>
    // Preserve the query string (e.g. ?id=123) across the redirect.
    location.replace('/admin/product-editor.html' + (location.search || ''));
  </script>
</head>
<body>
  <p>This editor has moved. Redirecting to the
    <a id="link" href="/admin/product-editor.html">product editor</a>…</p>
  <script>
    document.getElementById('link').href = '/admin/product-editor.html' + (location.search || '');
  </script>
</body>
</html>
