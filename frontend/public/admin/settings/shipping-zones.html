<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping Zones - Peekaboo Shades Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css?v=1737200003.0.28">
  <script src="/admin/js/admin.js?v=1737100001"></script>
  <script src="/admin/js/adminNavConfig.js?v=1737200002"></script>
  <style>
    .zones-grid { display: grid; gap: 1rem; margin-top: 1.5rem; }
    .zone-card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .zone-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem; }
    .zone-name { font-size: 1.1rem; font-weight: 600; margin: 0; }
    .zone-toggle { position: relative; width: 48px; height: 24px; }
    .zone-toggle input { opacity: 0; width: 0; height: 0; }
    .zone-toggle .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ddd; border-radius: 24px; transition: 0.3s; }
    .zone-toggle .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
    .zone-toggle input:checked + .slider { background: #10B981; }
    .zone-toggle input:checked + .slider:before { transform: translateX(24px); }
    .zone-regions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .region-tag { padding: 0.25rem 0.5rem; background: #f0f0f0; border-radius: 4px; font-size: 0.85rem; }
    .shipping-methods { border-top: 1px solid #eee; padding-top: 1rem; }
    .shipping-methods h4 { margin: 0 0 0.75rem 0; font-size: 0.9rem; color: #666; }
    .method-row { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; background: #f9f9f9; border-radius: 6px; margin-bottom: 0.5rem; }
    .method-name { font-weight: 500; }
    .method-price { display: flex; align-items: center; gap: 0.5rem; }
    .method-price input { width: 80px; padding: 0.4rem; border: 1px solid #ddd; border-radius: 4px; text-align: right; }
    .zone-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .btn-action { padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-edit { background: #8E6545; color: white; }
    .btn-delete { background: #FEE2E2; color: #991B1B; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: white; border-radius: 12px; padding: 2rem; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 1.5rem; }
    .modal-header h2 { margin: 0; }
    .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; }
    .checkbox-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .checkbox-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; background: #f5f5f5; border-radius: 4px; }
    .btn-submit { width: 100%; padding: 0.875rem; background: #8E6545; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar"></aside>
    <main class="admin-main">
      <header class="admin-header">
        <h1>Shipping Zones</h1>
        <div class="header-actions">
          <button class="btn-primary" onclick="openModal()">+ Add Zone</button>
        </div>
      </header>
      <div class="admin-content">
        <div class="zones-grid" id="zonesGrid"></div>
      </div>
    </main>
  </div>
  <div class="modal" id="zoneModal">
    <div class="modal-content">
      <div class="modal-header"><h2 id="modalTitle">Add Shipping Zone</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
      <form onsubmit="saveZone(event)">
        <input type="hidden" id="zoneId">
        <div class="form-group"><label>Zone Name</label><input type="text" id="zoneName" required placeholder="e.g., West Coast"></div>
        <div class="form-group">
          <label>States/Regions</label>
          <div class="checkbox-grid" id="statesGrid"></div>
        </div>
        <div class="form-group">
          <label>Standard Shipping Rate ($)</label>
          <input type="number" id="standardRate" step="0.01" value="9.99">
        </div>
        <div class="form-group">
          <label>Express Shipping Rate ($)</label>
          <input type="number" id="expressRate" step="0.01" value="19.99">
        </div>
        <div class="form-group">
          <label>Free Shipping Threshold ($)</label>
          <input type="number" id="freeThreshold" step="0.01" value="200" placeholder="Leave empty for no free shipping">
        </div>
        <button type="submit" class="btn-submit">Save Zone</button>
      </form>
    </div>
  </div>
  <script>
    const states = ['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];
    let shippingConfig = {};
    let zones = [];

    document.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('admin_token')) { window.location.href = '/admin/login.html'; return; }
      AdminNavConfig.initSidebar('shipping-zones');
      loadShippingConfig();
    });

    async function loadShippingConfig() {
      const token = localStorage.getItem('admin_token');
      const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

      try {
        const res = await fetch('/api/admin/system-config', { headers });
        const data = await res.json();

        if (data.success && data.data && data.data.shipping) {
          shippingConfig = data.data.shipping;
          zones = (shippingConfig.zones || []).map((z, idx) => ({
            id: z.id || 'z-' + idx,
            name: z.name,
            enabled: z.enabled !== false,
            states: z.includeStates || z.countries || [],
            excludeStates: z.excludeStates || [],
            methods: {
              standard: (z.rates && z.rates[0]) ? z.rates[0].price : 9.99,
              express: (z.rates && z.rates[1]) ? z.rates[1].price : 19.99
            },
            freeThreshold: shippingConfig.freeShippingThreshold || null,
            rates: z.rates || []
          }));
          renderZones();
        } else {
          // If no config exists, show empty state
          renderZones();
        }
      } catch (error) {
        console.error('Error loading shipping config:', error);
        Admin.Toast.error('Error loading shipping configuration');
      }
    }

    async function saveShippingConfig() {
      const token = localStorage.getItem('admin_token');
      const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

      const updatedConfig = {
        ...shippingConfig,
        zones: zones.map(z => ({
          id: z.id,
          name: z.name,
          enabled: z.enabled,
          countries: ['US'],
          includeStates: z.states,
          excludeStates: z.excludeStates || [],
          rates: [
            { maxWeight: 20, price: z.methods.standard, method: 'standard' },
            { maxWeight: 20, price: z.methods.express, method: 'express' }
          ]
        })),
        freeShippingThreshold: zones[0]?.freeThreshold || shippingConfig.freeShippingThreshold
      };

      try {
        const res = await fetch('/api/admin/system-config/shipping', {
          method: 'PUT',
          headers,
          body: JSON.stringify(updatedConfig)
        });
        const data = await res.json();

        if (data.success) {
          Admin.Toast.success('Shipping zones saved successfully');
        } else {
          Admin.Toast.error('Failed to save: ' + (data.error || 'Unknown error'));
        }
      } catch (error) {
        console.error('Error saving shipping config:', error);
        Admin.Toast.error('Error saving shipping configuration');
      }
    }

    function renderZones() {
      if (zones.length === 0) {
        document.getElementById('zonesGrid').innerHTML = `
          <div class="zone-card" style="text-align: center; padding: 3rem;">
            <p style="color: #666; margin-bottom: 1rem;">No shipping zones configured.</p>
            <button class="btn-action btn-edit" onclick="openModal()">+ Add First Zone</button>
          </div>`;
        return;
      }

      document.getElementById('zonesGrid').innerHTML = zones.map(zone => `
        <div class="zone-card">
          <div class="zone-header">
            <div>
              <h3 class="zone-name">${zone.name}</h3>
              <div style="font-size: 0.85rem; color: #666; margin-top: 0.25rem;">${zone.states.length} states/regions</div>
            </div>
            <label class="zone-toggle">
              <input type="checkbox" ${zone.enabled ? 'checked' : ''} onchange="toggleZone('${zone.id}')">
              <span class="slider"></span>
            </label>
          </div>
          <div class="zone-regions">
            ${zone.states.map(s => `<span class="region-tag">${s}</span>`).join('')}
          </div>
          <div class="shipping-methods">
            <h4>Shipping Methods</h4>
            <div class="method-row">
              <span class="method-name">Standard (5-7 days)</span>
              <div class="method-price">
                <span>$</span>
                <input type="number" value="${zone.methods.standard}" step="0.01" onchange="updateRate('${zone.id}', 'standard', this.value)">
              </div>
            </div>
            <div class="method-row">
              <span class="method-name">Express (2-3 days)</span>
              <div class="method-price">
                <span>$</span>
                <input type="number" value="${zone.methods.express}" step="0.01" onchange="updateRate('${zone.id}', 'express', this.value)">
              </div>
            </div>
            <div class="method-row">
              <span class="method-name">Free Shipping Over</span>
              <div class="method-price">
                <span>$</span>
                <input type="number" value="${zone.freeThreshold || ''}" placeholder="N/A" onchange="updateThreshold('${zone.id}', this.value)">
              </div>
            </div>
          </div>
          <div class="zone-actions">
            <button class="btn-action btn-edit" onclick="editZone('${zone.id}')">Edit States</button>
            <button class="btn-action btn-delete" onclick="deleteZone('${zone.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function toggleZone(id) {
      const zone = zones.find(z => z.id === id);
      if (zone) {
        zone.enabled = !zone.enabled;
        await saveShippingConfig();
      }
    }

    async function updateRate(id, method, value) {
      const zone = zones.find(z => z.id === id);
      if (zone) {
        zone.methods[method] = parseFloat(value);
        await saveShippingConfig();
      }
    }

    async function updateThreshold(id, value) {
      const zone = zones.find(z => z.id === id);
      if (zone) {
        zone.freeThreshold = value ? parseFloat(value) : null;
        await saveShippingConfig();
      }
    }

    function openModal(zone = null) {
      document.getElementById('zoneId').value = zone ? zone.id : '';
      document.getElementById('zoneName').value = zone ? zone.name : '';
      document.getElementById('standardRate').value = zone ? zone.methods.standard : 9.99;
      document.getElementById('expressRate').value = zone ? zone.methods.express : 19.99;
      document.getElementById('freeThreshold').value = zone ? zone.freeThreshold || '' : 200;

      const selectedStates = zone ? zone.states : [];
      document.getElementById('statesGrid').innerHTML = states.map(s => `
        <label class="checkbox-item">
          <input type="checkbox" name="states" value="${s}" ${selectedStates.includes(s) ? 'checked' : ''}>
          ${s}
        </label>
      `).join('');

      document.getElementById('modalTitle').textContent = zone ? 'Edit Shipping Zone' : 'Add Shipping Zone';
      document.getElementById('zoneModal').classList.add('active');
    }

    function closeModal() { document.getElementById('zoneModal').classList.remove('active'); }

    function editZone(id) {
      const zone = zones.find(z => z.id === id);
      if (zone) openModal(zone);
    }

    async function deleteZone(id) {
      if (!confirm('Delete this shipping zone?')) return;

      zones = zones.filter(z => z.id !== id);
      renderZones();
      await saveShippingConfig();
      Admin.Toast.success('Zone deleted');
    }

    async function saveZone(e) {
      e.preventDefault();
      const id = document.getElementById('zoneId').value;
      const selectedStates = Array.from(document.querySelectorAll('input[name="states"]:checked')).map(cb => cb.value);

      const data = {
        name: document.getElementById('zoneName').value,
        states: selectedStates,
        methods: {
          standard: parseFloat(document.getElementById('standardRate').value),
          express: parseFloat(document.getElementById('expressRate').value)
        },
        freeThreshold: document.getElementById('freeThreshold').value ? parseFloat(document.getElementById('freeThreshold').value) : null
      };

      if (id) {
        const idx = zones.findIndex(z => z.id === id);
        if (idx >= 0) zones[idx] = { ...zones[idx], ...data };
      } else {
        data.id = 'z-' + Date.now();
        data.enabled = true;
        zones.push(data);
      }

      closeModal();
      renderZones();
      await saveShippingConfig();
      Admin.Toast.success(id ? 'Zone updated' : 'Zone created');
    }

    document.getElementById('zoneModal').addEventListener('click', e => { if (e.target.id === 'zoneModal') closeModal(); });
  </script>
</body>
</html>
