<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Requests - Peekaboo Shades Admin</title>
  <link rel="stylesheet" href="css/admin.css?v=1737200003">
  <link rel="icon" type="image/jpeg" href="/images/peekabooshades_logo.jpeg">
  <style>
    .sample-filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-group label {
      font-size: 13px;
      color: #6D7175;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-badge.pending {
      background: #FFF5EA;
      color: #B98900;
    }
    .status-badge.fulfilled {
      background: #E3F5E1;
      color: #059669;
    }
    .status-badge.cancelled {
      background: #FEE2E2;
      color: #DC2626;
    }
    .status-badge.processing {
      background: #E8F4FD;
      color: #2C6ECB;
    }
    .sample-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .sample-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: #F6F6F7;
      border-radius: 4px;
      font-size: 11px;
      color: #202223;
    }
    .sample-chip img {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      object-fit: cover;
    }
    .customer-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .customer-name {
      font-weight: 500;
      color: #202223;
    }
    .customer-email {
      font-size: 12px;
      color: #6D7175;
    }
    .address-text {
      font-size: 12px;
      color: #6D7175;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: white;
      border-radius: 8px;
      padding: 16px;
      border: 1px solid #E5E5E5;
    }
    .stat-card-value {
      font-size: 28px;
      font-weight: 600;
      color: #202223;
    }
    .stat-card-label {
      font-size: 13px;
      color: #6D7175;
      margin-top: 4px;
    }
    .stat-card.pending .stat-card-value {
      color: #B98900;
    }
    .stat-card.fulfilled .stat-card-value {
      color: #059669;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }
    .empty-state svg {
      width: 64px;
      height: 64px;
      color: #8C9196;
      margin-bottom: 16px;
    }
    .empty-state h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #202223;
    }
    .empty-state p {
      color: #6D7175;
      margin-bottom: 20px;
    }
    .modal-samples-list {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #E5E5E5;
      border-radius: 8px;
      margin-top: 12px;
    }
    .modal-sample-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid #E5E5E5;
    }
    .modal-sample-item:last-child {
      border-bottom: none;
    }
    .modal-sample-img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid #E5E5E5;
    }
    .modal-sample-info {
      flex: 1;
    }
    .modal-sample-code {
      font-weight: 600;
      color: #8E6545;
    }
    .modal-sample-name {
      font-size: 13px;
      color: #6D7175;
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <!-- Sidebar content will be injected dynamically -->
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <!-- Header -->
      <header class="admin-header">
        <div class="header-left">
          <button class="header-btn mobile-menu-btn" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <div class="breadcrumb">
            <a href="/admin/" class="breadcrumb-link">Dashboard</a>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-current">Sample Requests</span>
          </div>
        </div>
        <div class="header-right">
          <a href="/" class="header-btn" title="View Store" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
          </a>
          <div class="dropdown">
            <div class="header-profile">
              <div class="profile-avatar">A</div>
              <span class="profile-name">Admin</span>
            </div>
            <div class="dropdown-menu profile-dropdown">
              <a href="/admin/settings.html" class="dropdown-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                Profile
              </a>
              <div class="dropdown-divider"></div>
              <a href="#" class="dropdown-item danger" onclick="Admin.AuthAPI.logout(); return false;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Logout
              </a>
            </div>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <div class="admin-content">
        <div class="page-header">
          <h1 class="page-title">Sample Requests</h1>
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-secondary" onclick="exportRequests()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
              </svg>
              Export
            </button>
          </div>
        </div>

        <!-- Stats Cards -->
        <div class="stat-cards">
          <div class="stat-card pending">
            <div class="stat-card-value" id="pendingCount">0</div>
            <div class="stat-card-label">Pending Requests</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-value" id="processingCount">0</div>
            <div class="stat-card-label">Processing</div>
          </div>
          <div class="stat-card fulfilled">
            <div class="stat-card-value" id="fulfilledCount">0</div>
            <div class="stat-card-label">Fulfilled</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-value" id="totalCount">0</div>
            <div class="stat-card-label">Total Requests</div>
          </div>
        </div>

        <!-- Filters -->
        <div class="sample-filters">
          <div class="search-box" style="flex: 1; max-width: 400px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input type="text" id="searchInput" placeholder="Search by name, email, or fabric code...">
          </div>
          <div class="filter-group">
            <label>Status:</label>
            <select id="statusFilter" class="form-select" style="min-width: 140px;">
              <option value="">All Status</option>
              <option value="pending">Pending</option>
              <option value="processing">Processing</option>
              <option value="fulfilled">Fulfilled</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Sort:</label>
            <select id="sortFilter" class="form-select" style="min-width: 160px;">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>
        </div>

        <!-- Requests Table -->
        <div class="card">
          <div class="table-container" style="overflow-x: auto;">
            <table class="admin-table" style="width: 100%; border-collapse: collapse; border: 2px solid #8E6545; min-width: 1000px;">
              <thead>
                <tr style="background: #8E6545; color: white;">
                  <th style="padding: 12px; border: 1px solid #ddd; text-align: left;">REQUEST ID</th>
                  <th style="padding: 12px; border: 1px solid #ddd; text-align: left;">CUSTOMER</th>
                  <th style="padding: 12px; border: 1px solid #ddd; text-align: left;">SHIPPING ADDRESS</th>
                  <th style="padding: 12px; border: 1px solid #ddd; text-align: left;">SAMPLES</th>
                  <th style="padding: 12px; border: 1px solid #ddd; text-align: center;">STATUS</th>
                  <th style="padding: 12px; border: 1px solid #ddd; text-align: left;">REQUESTED</th>
                  <th style="width: 120px; padding: 12px; border: 1px solid #ddd;">ACTIONS</th>
                </tr>
              </thead>
              <tbody id="requestsTable">
                <tr>
                  <td colspan="7" style="text-align: center; padding: 40px; border: 1px solid #ddd;">
                    Loading sample requests...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Request Details Modal -->
  <div class="modal" id="detailsModal">
    <div class="modal-overlay" onclick="closeModal()"></div>
    <div class="modal-content" style="max-width: 600px;">
      <div class="modal-header">
        <h2 id="modalTitle">Request Details</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Content injected dynamically -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Close</button>
        <div id="modalActions"></div>
      </div>
    </div>
  </div>

  <script src="js/adminNavConfig.js?v=1737200002"></script>
  <script src="js/admin.js?v=1737100001"></script>
  <script>
    let sampleRequests = [];
    let currentRequest = null;

    // Require authentication
    if (!Admin.Auth.requireAuth()) {
      // Will redirect to login
    } else {
      loadSampleRequests();
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', debounce(filterRequests, 300));
    document.getElementById('statusFilter').addEventListener('change', filterRequests);
    document.getElementById('sortFilter').addEventListener('change', filterRequests);

    async function loadSampleRequests() {
      try {
        const response = await Admin.API.get('/sample-requests');

        if (response.success) {
          sampleRequests = response.data || [];
          updateStats();
          filterRequests();
        }
      } catch (error) {
        console.error('Failed to load sample requests:', error);
        Admin.Toast.error('Failed to load sample requests');
      }
    }

    function updateStats() {
      const pending = sampleRequests.filter(r => r.status === 'pending').length;
      const processing = sampleRequests.filter(r => r.status === 'processing').length;
      const fulfilled = sampleRequests.filter(r => r.status === 'fulfilled').length;

      document.getElementById('pendingCount').textContent = pending;
      document.getElementById('processingCount').textContent = processing;
      document.getElementById('fulfilledCount').textContent = fulfilled;
      document.getElementById('totalCount').textContent = sampleRequests.length;
    }

    function filterRequests() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;
      const sort = document.getElementById('sortFilter').value;

      let filtered = [...sampleRequests];

      // Filter by search
      if (search) {
        filtered = filtered.filter(r =>
          r.name?.toLowerCase().includes(search) ||
          r.email?.toLowerCase().includes(search) ||
          r.id?.toLowerCase().includes(search) ||
          r.samples?.some(s => s.code?.toLowerCase().includes(search) || s.name?.toLowerCase().includes(search))
        );
      }

      // Filter by status
      if (status) {
        filtered = filtered.filter(r => r.status === status);
      }

      // Sort
      if (sort === 'newest') {
        filtered.sort((a, b) => new Date(b.requestedAt) - new Date(a.requestedAt));
      } else {
        filtered.sort((a, b) => new Date(a.requestedAt) - new Date(b.requestedAt));
      }

      renderRequests(filtered);
    }

    function renderRequests(requests) {
      const tbody = document.getElementById('requestsTable');

      if (!requests || requests.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="border: 1px solid #ddd;">
              <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                </svg>
                <h3>No sample requests</h3>
                <p>Sample requests from customers will appear here</p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = requests.map(request => {
        const sampleChips = (request.samples || []).slice(0, 3).map(s =>
          `<span class="sample-chip">${escapeHtml(s.code || s.name || 'Sample')}</span>`
        ).join('');
        const moreCount = (request.samples || []).length > 3 ?
          `<span class="sample-chip">+${(request.samples || []).length - 3} more</span>` : '';

        return `
          <tr style="background: white;">
            <td style="padding: 12px; border: 1px solid #ddd;">
              <a href="#" onclick="viewDetails('${request.id}'); return false;" style="color: #2c6ecb; text-decoration: none; font-weight: 500;">
                ${escapeHtml(request.id)}
              </a>
            </td>
            <td style="padding: 12px; border: 1px solid #ddd;">
              <div class="customer-info">
                <span class="customer-name">${escapeHtml(request.name)}</span>
                <span class="customer-email">${escapeHtml(request.email)}</span>
                ${request.phone ? `<span class="customer-email">${escapeHtml(request.phone)}</span>` : ''}
              </div>
            </td>
            <td style="padding: 12px; border: 1px solid #ddd;">
              <span class="address-text" title="${escapeHtml(formatAddress(request.address))}">${escapeHtml(formatAddress(request.address))}</span>
            </td>
            <td style="padding: 12px; border: 1px solid #ddd;">
              <div class="sample-chips">
                ${sampleChips}
                ${moreCount}
              </div>
            </td>
            <td style="padding: 12px; border: 1px solid #ddd; text-align: center;">
              <span class="status-badge ${request.status}">${capitalizeFirst(request.status)}</span>
            </td>
            <td style="padding: 12px; border: 1px solid #ddd;">
              ${formatDate(request.requestedAt)}
            </td>
            <td style="padding: 12px; border: 1px solid #ddd;">
              <div style="display: flex; gap: 8px;">
                <button class="btn btn-secondary btn-sm" onclick="viewDetails('${request.id}')" title="View Details">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                  </svg>
                </button>
                ${request.status === 'pending' ? `
                  <button class="btn btn-primary btn-sm" onclick="updateStatus('${request.id}', 'processing')" title="Mark Processing">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                  </button>
                ` : ''}
                ${request.status === 'processing' ? `
                  <button class="btn btn-primary btn-sm" onclick="updateStatus('${request.id}', 'fulfilled')" title="Mark Fulfilled" style="background: #059669; border-color: #059669;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                  </button>
                ` : ''}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function viewDetails(id) {
      currentRequest = sampleRequests.find(r => r.id === id);
      if (!currentRequest) return;

      const modalBody = document.getElementById('modalBody');
      const modalActions = document.getElementById('modalActions');

      modalBody.innerHTML = `
        <div style="margin-bottom: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h3 style="margin: 0; color: #202223;">Request ${escapeHtml(currentRequest.id)}</h3>
            <span class="status-badge ${currentRequest.status}">${capitalizeFirst(currentRequest.status)}</span>
          </div>

          <div style="background: #F6F6F7; padding: 16px; border-radius: 8px; margin-bottom: 16px;">
            <h4 style="margin: 0 0 12px 0; font-size: 14px; color: #6D7175;">Customer Information</h4>
            <p style="margin: 0 0 8px 0;"><strong>Name:</strong> ${escapeHtml(currentRequest.name)}</p>
            <p style="margin: 0 0 8px 0;"><strong>Email:</strong> <a href="mailto:${escapeHtml(currentRequest.email)}">${escapeHtml(currentRequest.email)}</a></p>
            ${currentRequest.phone ? `<p style="margin: 0 0 8px 0;"><strong>Phone:</strong> ${escapeHtml(currentRequest.phone)}</p>` : ''}
            <p style="margin: 0;"><strong>Address:</strong> ${escapeHtml(formatAddress(currentRequest.address))}</p>
          </div>

          <h4 style="margin: 0 0 8px 0; font-size: 14px; color: #6D7175;">Requested Samples (${(currentRequest.samples || []).length})</h4>
          <div class="modal-samples-list">
            ${(currentRequest.samples || []).map(s => `
              <div class="modal-sample-item">
                ${s.image ? `<img src="${escapeHtml(s.image)}" class="modal-sample-img" alt="${escapeHtml(s.code)}">` :
                  `<div class="modal-sample-img" style="background: #8E6545; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 12px;">${(s.code || 'S').charAt(0)}</div>`}
                <div class="modal-sample-info">
                  <div class="modal-sample-code">${escapeHtml(s.code || 'Unknown')}</div>
                  <div class="modal-sample-name">${escapeHtml(s.name || s.type || 'Fabric Sample')}</div>
                </div>
              </div>
            `).join('')}
          </div>

          <div style="margin-top: 16px; font-size: 12px; color: #6D7175;">
            <p style="margin: 0;">Requested: ${formatDateTime(currentRequest.requestedAt)}</p>
            ${currentRequest.updatedAt ? `<p style="margin: 4px 0 0 0;">Last Updated: ${formatDateTime(currentRequest.updatedAt)}</p>` : ''}
          </div>
        </div>
      `;

      // Dynamic action buttons based on status
      let actionHtml = '';
      if (currentRequest.status === 'pending') {
        actionHtml = `
          <button class="btn btn-danger" onclick="updateStatus('${currentRequest.id}', 'cancelled'); closeModal();" style="margin-right: 8px;">Cancel</button>
          <button class="btn btn-primary" onclick="updateStatus('${currentRequest.id}', 'processing'); closeModal();">Start Processing</button>
        `;
      } else if (currentRequest.status === 'processing') {
        actionHtml = `
          <button class="btn btn-primary" onclick="updateStatus('${currentRequest.id}', 'fulfilled'); closeModal();" style="background: #059669; border-color: #059669;">Mark as Fulfilled</button>
        `;
      } else if (currentRequest.status === 'fulfilled') {
        actionHtml = `<span style="color: #059669; font-weight: 500;">Completed</span>`;
      } else if (currentRequest.status === 'cancelled') {
        actionHtml = `<span style="color: #DC2626; font-weight: 500;">Cancelled</span>`;
      }
      modalActions.innerHTML = actionHtml;

      document.getElementById('detailsModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('detailsModal').classList.remove('active');
      currentRequest = null;
    }

    async function updateStatus(id, newStatus) {
      try {
        const response = await Admin.API.put(`/sample-requests/${id}`, { status: newStatus });

        if (response.success) {
          Admin.Toast.success(`Request marked as ${newStatus}`);
          loadSampleRequests();
        } else {
          Admin.Toast.error(response.error || 'Failed to update status');
        }
      } catch (error) {
        console.error('Failed to update status:', error);
        Admin.Toast.error('Failed to update status');
      }
    }

    function exportRequests() {
      let csvContent = 'Request ID,Name,Email,Phone,Address,Samples,Status,Requested Date\n';

      sampleRequests.forEach(r => {
        const samples = (r.samples || []).map(s => s.code || s.name).join('; ');
        csvContent += `"${r.id}","${r.name || ''}","${r.email || ''}","${r.phone || ''}","${formatAddress(r.address).replace(/"/g, '""')}","${samples}","${r.status}","${r.requestedAt}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sample-requests.csv';
      a.click();
      window.URL.revokeObjectURL(url);
      Admin.Toast.success('Sample requests exported');
    }

    // Helper functions
    function formatAddress(address) {
      if (!address) return '';
      if (typeof address === 'string') return address;
      const parts = [address.street, address.city, address.state, address.zip, address.country].filter(Boolean);
      return parts.join(', ');
    }

    function formatDate(dateString) {
      if (!dateString) return '-';
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatDateTime(dateString) {
      if (!dateString) return '-';
      const date = new Date(dateString);
      return date.toLocaleString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function capitalizeFirst(str) {
      return str ? str.charAt(0).toUpperCase() + str.slice(1) : '';
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }
  </script>
</body>
</html>
